name: Build Android APK (AMap Weather)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 配置 Gradle 环境
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: 编译 Debug APK
      run: gradle assembleDebug --stacktrace

    - name: 整理发布 APK 文件
      id: release_apk
      run: |
        TAG_NAME="v1.3.0-amap-$(date +'%Y%m%d%H%M')"
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        mkdir -p release_dist
        cp app/build/outputs/apk/debug/*.apk "release_dist/RadioFM-AMap.apk"
        cp app/build/outputs/apk/debug/*.apk "release_dist/RadioFM-Latest.apk"

    - name: 上传 APK 安装包至 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: RadioFM-AMap-Debug-APK
        path: release_dist/RadioFM-AMap.apk
        retention-days: 7

    - name: 发布 APK 到 GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_apk.outputs.tag_name }}
        name: FM网络收音机 高德天气版 v1.3.0 (${{ steps.release_apk.outputs.tag_name }})
        body: |
          ### FM网络收音机 高德天气版 (RadioFM-AMap)

          > 独立仓库版本：把天气与逆地理从 Open-Meteo / 系统 Geocoder 切换为高德地图 Web 服务 API。versionCode 9，可直接覆盖安装。

          - 逆地理编码：restapi.amap.com/v3/geocode/regeo，位移超过 150 米或跨区自动刷新县市名称；
          - 实时天气：restapi.amap.com/v3/weather/weatherInfo，按 adcode 查询，15 分钟刷新；
          - 定位链路不变：GPS → 网络基站 → ip-api.com 兜底取经纬度，再交给高德解析；
          - 高德 Key 写在 WeatherLocationHelper.kt 的 AMAP_KEY 常量中，可自行替换；
          - 播放内核保持 v1.2.3：全部流由 LibVLC 3.0.23 播放，AudioFocus 复用修复已包含。
        files: |
          release_dist/RadioFM-AMap.apk
          release_dist/RadioFM-Latest.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
